# Production stack for prosper-challenge.adriaguilera.com (deployed by Dokploy on push to main).
# Basic auth and TLS live in Traefik on the VPS; see deploy/README.md.
services:
  db:
    build: ../db
    environment:
      POSTGRES_USER: prosper
      POSTGRES_PASSWORD: prosper
      POSTGRES_DB: prosper
    # Loopback only: the app reaches it from the host network.
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosper"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  app:
    build: ..
    # WebRTC audio flows straight between the browser and this process over UDP, so the
    # bot must advertise the VPS's public IP: run it on the host network, not a bridge.
    network_mode: host
    environment:
      DATABASE_URL: postgresql://prosper:prosper@127.0.0.1:5433/prosper
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      # Call traces (monitoring.py); tracing is off if these are empty.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      ENVIRONMENT: production
      # Bind HTTP to the docker0 bridge only: Traefik reaches it there, the internet doesn't.
      HOST: 172.17.0.1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
